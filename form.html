<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Donor Information</h1>
    <table>
        <tr>
            <td><label for="First Name*"> First Name*<label></td>
            <td><input type="text" id="FirstName*" FirstName*="FirstName*" required></td>
        </tr>
        <tr>
            <td><label for="Last Name"> Last Name*<label></td>
            <td><input type="text" id="LastName" LastName="LastName" required></td>
        </tr>
        <tr>
            <td><label for="Company"> Company*<label></td>
            <td><input type="text" id="Company" Company="Company" required></td>
        </tr>
        <tr>
            <td><label for="Address 1"> Address 1*<label></td>
            <td><input type="text" id="Address 1" Address 1="Address 1" required></td>
        </tr>
        <tr>
            <td><label for="Address 2"> Address 2*<label></td>
            <td><input type="text" id="Address 2" Address 2="Address 2" required></td>
        </tr>
        <tr>
            <td><label for="City"> City*<label></td>
            <td><input type="text" id="City" City="City" required></td>
        </tr>
        <tr>
            <td><label for="State"> State*</label></td>
            <td>
                <Select id="State" name="State">
                    <option>Select any State</option>
                    <option>Bangladesh</option>
                    <option>India</option>
                    <option>UK</option>
                    <option>USA</option>
                </Select>
            </td>
        </tr>
        <tr>
            <td><label for=Zip Code> Zip Code*<label></td>
            <td><input type="text" id="Zip code" Zip Code="Zip code" required></td>
        </tr>
        <tr>
            <td><label for="Country"> Country*</label></td>
            <td>
                <Select id="Country" name="Country">
                    <option>Select a Country</option>
                    <option>Bangladesh</option>
                    <option>India</option>
                    <option>UK</option>
                    <option>USA</option>
                </Select>
            </td>
        </tr>
        <tr>
            <td><label for="Phone"> Phone*<label></td>
            <td><input type="tel" id="Zip code" Phone="Phone"></td>
        </tr>
        <tr>
            <td><label for="fax">Fax*</label></td>
            <td><input type="text" id="fax" name="fax"></td>

        </tr>
        <tr>
            <td><label for="email">Email*</label></td>
            <td><input type="email" id="email" name="email" required></td>
        </tr>
        <tr>
            <td>
                Donation Amount*<br>
                (Check a button or type in your<br>
                amount)
            </td>
            <td>
                <input type="radio" name="amount" value="None" required>None
                <input type="radio" name="amount" value="50"> $50
                <input type="radio" name="amount" value="75"> $75
                <input type="radio" name="amount" value="100"> $100
                <input type="radio" name="amount" value="250"> $250
                <input type="radio" name="amount" value="Other"> Other
                <br><br>
                OtherAmount $
                <input type=":number" name="other_amount" min="1">
            </td>
        </tr>
        <tr>
            <td><label for="recuring">Recurring Donation</label>
                <br>
                (Check if yes)
            </td>
            <td>
                <input type="checkbox" id="recurring" name="recurring" value="Yes">
                I am interested in giving on a regular basis.
                <br>
                Monthly Credit Card $
                <input type="number" name="monthly_amount" min="1">
                For
                <input type="number" name="months" min="1">
                Months
            </td>
        </tr>
    </table>
</body>

</html>
